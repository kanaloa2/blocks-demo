<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6N55JYVPMX"></script>
<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocks — Clients</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface2: #f0efe9; --surface3: #e8e7e0;
  --text: #181816; --text2: #5c5b57; --text3: #9a9994;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.13);
  --purple: #534AB7; --purple-lt: #EEEDFE; --purple-md: #AFA9EC;
  --teal: #0F6E56; --teal-lt: #E1F5EE;
  --coral: #C94E28; --coral-lt: #FAECE7;
  --amber: #A06010; --amber-lt: #FEF3DC;
  --red: #B83232; --red-lt: #FCEBEB;
  --green: #2E7D32; --green-lt: #EAF3DE;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --shadow: 0 1px 4px rgba(0,0,0,0.07), 0 0 0 0.5px rgba(0,0,0,0.07);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; min-width: 1100px; }
.topnav { background: var(--surface); border-bottom: 0.5px solid var(--border2); display: flex; align-items: center; padding: 0 1.25rem; height: 52px; gap: 2rem; position: sticky; top: 0; z-index: 20; }
.logo { display: flex; align-items: center; gap: 9px; font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; text-decoration: none; }
.logo-mark { width: 28px; height: 28px; background: var(--purple); border-radius: 7px; display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; padding: 5px; }
.logo-mark span { background: white; border-radius: 1.5px; }
.logo-mark span:nth-child(2), .logo-mark span:nth-child(3) { opacity: 0.65; } .logo-mark span:nth-child(4) { opacity: 0.35; }
.subnav { font-size: 11px; color: var(--text3); margin-top: 1px; }
.nav-links { display: flex; gap: 0; flex: 1; }
.nav-links a { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text2); text-decoration: none; padding: 0 14px; height: 52px; display: flex; align-items: center; border-bottom: 2px solid transparent; }
.nav-links a.active { color: var(--purple); border-bottom-color: var(--purple); font-weight: 500; }
.nav-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #534AB7, #1D9E75); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: white; }
.shell { display: grid; grid-template-columns: 68px 1fr; min-height: calc(100vh - 52px); }
.sidenav { background: var(--surface); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 1rem 0; gap: 4px; }
.sidenav-item { width: 64px; height: 52px; border-radius: var(--r-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--text3); font-size: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; text-align: center; }
.sidenav-item.active { background: var(--purple-lt); color: var(--purple); }
.page-content { padding: 1.5rem; }
.page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.5rem; }
.page-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.table-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.client-table { width: 100%; border-collapse: collapse; }
.client-table th { font-size: 10px; text-transform: uppercase; color: var(--text3); text-align: left; padding: 8px 14px; background: var(--surface2); border-bottom: 0.5px solid var(--border2); }
.client-table td { padding: 11px 14px; border-bottom: 0.5px solid var(--border); }
.client-cell { display: flex; align-items: center; gap: 10px; }
.client-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; display: inline-block; }
.mono { font-family: 'DM Mono', monospace; }

/* Hamburger Menu CSS */
.hamburger { display: none; flex-direction: column; gap: 4.5px; cursor: pointer; padding: 6px; border-radius: 6px; border: 0.5px solid var(--border2); background: transparent; }
.hamburger span { display: block; width: 18px; height: 1.5px; background: #181816; transition: 0.2s; }
.mobile-menu { display: none; position: fixed; top: 52px; left: 0; right: 0; background: white; border-bottom: 0.5px solid var(--border2); flex-direction: column; z-index: 100; }
.mobile-menu.open { display: flex; }

@media (max-width: 900px) {
  .hamburger { display: flex; }
  .nav-links, .sidenav { display: none; }
  .shell { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav class="topnav">
  <div style="display:flex;flex-direction:column;">
    <a href="index.html" class="logo">
      <div class="logo-mark"><span></span><span></span><span></span><span></span></div>
      Blocks
    </a>
    <div class="subnav">AI-assisted portfolio construction</div>
  </div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="clients.html" class="active">Clients</a>
    <a href="blocks-builder.html">Block Library</a>
    <a href="assembly.html">Build</a>
  </div>
  <div class="nav-right">
    <div class="avatar">CJ</div>
  </div>
  <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()"><span></span><span></span><span></span></button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="dashboard.html" style="padding:15px; border-bottom:1px solid #eee; text-decoration:none; color:inherit;">Dashboard</a>
  <a href="clients.html" style="padding:15px; text-decoration:none; color:inherit;">Clients</a>
</div>

<div class="shell">
  <nav class="sidenav">
    <div class="sidenav-item" onclick="location.href='dashboard.html'">Dash</div>
    <div class="sidenav-item active">Clients</div>
    <div class="sidenav-item" onclick="location.href='blocks-builder.html'">Blocks</div>
  </nav>

  <div class="page-content">
    <div class="page-header">
      <div>
        <div class="page-title">Clients</div>
        <div id="client-count" style="font-size:12px; color:var(--text3);">Loading households...</div>
      </div>
    </div>

    <div class="table-card">
      <table class="client-table">
        <thead>
          <tr>
            <th>Client</th>
            <th>Tags</th>
            <th>AUM</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="clients-list">
          </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Replace these with your actual keys from Supabase Dashboard
  const SUPABASE_URL = 'https://rytmoxxpoegllfbusykt.supabase.co'; 
  const SUPABASE_KEY = 'sb_publishable_r86loDzli-AOYkWFDKbe9A_X9-uATdk';

  let _supabase;

  async function init() {
    try {
      // Create client
      _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      
      // Fetch data
      const { data: households, error } = await _supabase
        .from('households')
        .select('*');

      if (error) throw error;

      const listContainer = document.getElementById('clients-list');
      const countLabel = document.getElementById('client-count');
      
      countLabel.innerText = `${households.length} active households`;
      listContainer.innerHTML = '';

      households.forEach(house => {
        const row = document.createElement('tr');
        
        const tagsHtml = house.tags ? house.tags.map(tag => 
          `<span class="tag" style="background:var(--purple-lt);color:var(--purple);margin-right:4px;">${tag}</span>`
        ).join('') : '';

        row.innerHTML = `
          <td>
            <div class="client-cell">
              <div class="client-avatar" style="background:var(--surface2);color:var(--text2);">
                ${house.name ? house.name.charAt(0) : '?'}
              </div>
              <div>
                <div class="client-cname">${house.name || 'Unnamed'}</div>
                <div class="client-type">Household</div>
              </div>
            </div>
          </td>
          <td>${tagsHtml}</td>
          <td><span class="mono">$0.0M</span></td>
          <td><span class="tag" style="background:var(--teal-lt);color:var(--teal);">Active</span></td>
        `;
        listContainer.appendChild(row);
      });

    } catch (err) {
      console.error("Initialization Error:", err.message);
      document.getElementById('client-count').innerText = "Connection error. Check console.";
    }
  }

  function toggleMobileMenu() {
    document.getElementById('mobileMenu').classList.toggle('open');
  }

  // Ensure library is loaded before calling init
  window.onload = init;
</script>

</body>
</html>
